VERSIONS="0.4.3"
NAME="Salam ($VERSION)"
SOURCE_FILE="main.salam"
BINARY_FILE="main"
COMPILE_CMD="/usr/local/salam-glibc/ld-linux-x86-64.so.2 --library-path /usr/local/salam-glibc /usr/local/salam-$VERSION/salam llvm $ARGS --stdlib-path=/usr/local/salam-$VERSION/std --emit-exec --log-level=error --output=main main.salam"
RUN_CMD="/usr/local/salam-glibc/ld-linux-x86-64.so.2 --library-path /usr/local/salam-glibc ./$BINARY_FILE"